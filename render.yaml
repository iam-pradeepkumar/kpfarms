services:
  - type: web
    name: kp-farm-ventures
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Build target: produces a plain Node server in .output/server/index.mjs
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # ---- Public/Secret Supabase credentials to supply in Render Dashboard ----
      - key: VITE_SUPABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      # ---- Secrets: paste the values in the Render dashboard ----
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LOVABLE_API_KEY
        sync: false
      - key: GOOGLE_CALENDAR_APP_USER_CONNECTOR_CLIENT_API_KEY
        sync: false
      - key: APP_USER_CONNECTION_KEY_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_CRON_SECRET
        sync: false
