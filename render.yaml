services:
  - type: web
    name: kp-farm-ventures
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Build target: produces a plain Node server in .output/server/index.mjs
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # ---- Public Supabase credentials (new self-hosted project) ----
      - key: VITE_SUPABASE_URL
        value: https://ntkinaddmoefuhkxpzid.supabase.co
      - key: SUPABASE_URL
        value: https://ntkinaddmoefuhkxpzid.supabase.co
      - key: VITE_SUPABASE_PROJECT_ID
        value: ntkinaddmoefuhkxpzid
      - key: SUPABASE_PROJECT_ID
        value: ntkinaddmoefuhkxpzid
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_aGL6hwcIg2ODNZc66FmJVA_KypN1h7n
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_aGL6hwcIg2ODNZc66FmJVA_KypN1h7n

      # ---- Secrets: paste the values in the Render dashboard ----
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_USER_CONNECTION_KEY_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_CRON_SECRET
        sync: false
